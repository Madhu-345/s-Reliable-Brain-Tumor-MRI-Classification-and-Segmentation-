# ============================================================
# Segmentation Configuration
# ============================================================
# Uncertainty-Aware Evidential Brain Tumor Segmentation
#
# Dataset: BraTS 2020
# Modalities: T1, T1ce, T2, FLAIR
# Regions: WT, TC, ET
# ============================================================

experiment:
  name: "segmentation"
  description: "Uncertainty-Aware Evidential Brain Tumor Segmentation"
  seed: 42

# ============================================================
# Model
# ============================================================

model:

  name: "uncertainty_aware_multitask"

  backbone:
    name: "resnet50"
    pretrained: true
    trainable: true

  # Multi-scale feature extraction
  multi_scale:
    enabled: true

  # ----------------------------------------------------------
  # Uncertainty-Calibrated Spatial Attention
  # ----------------------------------------------------------

  ucsa:
    enabled: true

    base_attention:
      enabled: true

    uncertainty_map:
      enabled: true

    uncertainty_modulation:
      enabled: true

    gamma: 1.0

  # ----------------------------------------------------------
  # Classification branch disabled
  # ----------------------------------------------------------

  classification:
    enabled: false

  # ----------------------------------------------------------
  # Evidential Segmentation Branch
  # ----------------------------------------------------------

  segmentation:

    enabled: true

    evidential: true

    num_classes: 3

    regions:
      - "WT"
      - "TC"
      - "ET"

    decoder:
      type: "multi_scale"
      progressive_upsampling: true
      skip_connections: true

# ============================================================
# Data
# ============================================================

data:

  task: "segmentation"

  dataset: "BraTS2020"

  modalities:
    - "T1"
    - "T1ce"
    - "T2"
    - "FLAIR"

  regions:
    - "WT"
    - "TC"
    - "ET"

  preprocessing:

    skull_stripping: true

    intensity_normalization: true

    resize: true

  augmentation:

    enabled: true

    horizontal_flip: true

    vertical_flip: false

    rotation: true

    mild_intensity_variation: true

# ============================================================
# Training
# ============================================================

training:

  optimizer: "adam"

  learning_rate: 0.0001

  weight_decay: 0.00001

  batch_size: 16

  epochs: 100

  scheduler:

    name: "cosine_annealing"

  early_stopping:

    enabled: true

    monitor: "val_loss"

    mode: "min"

# ============================================================
# Segmentation Losses
# ============================================================

loss:

  # ----------------------------------------------------------
  # Evidential Segmentation Loss
  # ----------------------------------------------------------

  evidential_segmentation:

    enabled: true

    weight: 1.0

  # ----------------------------------------------------------
  # Dice Loss
  # ----------------------------------------------------------

  dice:

    enabled: true

    weight: 1.0

  # ----------------------------------------------------------
  # Dirichlet KL Regularization
  # ----------------------------------------------------------

  dirichlet_kl:

    enabled: true

    weight: 0.1

  # ----------------------------------------------------------
  # Calibration Loss
  # ----------------------------------------------------------

  calibration:

    enabled: true

    weight: 0.1

  # ----------------------------------------------------------
  # Attention–Uncertainty Alignment
  # ----------------------------------------------------------

  attention_uncertainty_alignment:

    enabled: true

    weight: 0.1

  # Classification losses are disabled
  evidential_classification:

    enabled: false

    weight: 0.0

# ============================================================
# Pixel-Wise Uncertainty
# ============================================================

uncertainty:

  enabled: true

  type: "dirichlet"

  output:

    pixel_wise: true

  # Uncertainty:
  # U_i = K / sum(alpha_i)

# ============================================================
# Segmentation Reliability
# ============================================================

reliability:

  enabled: true

  segmentation:

    threshold: 0.80

  decision:

    accept_if: "reliability >= threshold"

    otherwise: "abstain"

  empty_mask_fallback: true

# ============================================================
# Evaluation
# ============================================================

evaluation:

  metrics:

    - dice
    - iou
    - precision
    - recall
    - hd95

  regions:

    - "WT"
    - "TC"
    - "ET"

  uncertainty_metrics:

    - pixel_uncertainty
    - segmentation_reliability

  selective_prediction:

    enabled: true

    thresholds:

      - 0.50
      - 0.60
      - 0.70
      - 0.80
      - 0.90
      - 0.95

    metrics:

      - coverage
      - selective_dice
      - selective_risk

# ============================================================
# Output
# ============================================================

output:

  directory: "outputs/segmentation"

  save_checkpoint: true

  save_best_model: true

  save_metrics: true

  save_predictions: true

  save_segmentation_masks: true

  save_pixel_uncertainty: true

  save_reliability_scores: true

  save_accept_abstain_decisions: true

# ============================================================
# Hardware
# ============================================================

hardware:

  device: "cuda"

  mixed_precision: true

# ============================================================
# Reproducibility
# ============================================================

reproducibility:

  seed: 42

  deterministic: true